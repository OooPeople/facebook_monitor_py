<div
  class="runtime-error"
  data-runtime-error
  {% if not row.error_presenter.runtime_error %}hidden{% endif %}
>{{ row.error_presenter.runtime_error }}</div>
<div
  class="runtime-note"
  data-runtime-skip-reason
  {% if not row.error_presenter.runtime_skip_reason %}hidden{% endif %}
>{{ row.error_presenter.runtime_skip_reason }}</div>
